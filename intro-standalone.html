*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;user-select:none;
  font-family:'Space Grotesk',-apple-system,system-ui,sans-serif;
  --m:min(26vmin,240px); /* final mark width */
  --shift:calc(var(--m)*.62)} /* JS refines: centers the mark during the build */
.lockup{display:flex;align-items:center;gap:calc(var(--m)*.17)}
.markwrap{transform:translateX(var(--shift)) scale(1.42);
  animation:dock .8s cubic-bezier(.55,.05,.2,1) 2.05s both}
.mark{width:var(--m);height:auto;display:block;overflow:visible}
.mark path{fill:#800080}
.mark .fl-bar{transform-box:fill-box;transform-origin:0 100%;
  filter:drop-shadow(0 calc(var(--m)*.008) calc(var(--m)*.028) rgba(178,64,178,.35))}
.word{font-weight:700;font-size:calc(var(--m)*.64);line-height:1;color:#fff;
  letter-spacing:-.02em;opacity:0;
  animation:word-in .6s cubic-bezier(.2,.7,.3,1) 2.45s both}

/* ---- one-shot build (default): assemble, then hold ---- */
.fl-b3{animation:swing3 .8s cubic-bezier(.2,.7,.3,1) .3s both}
.fl-b2{animation:swing2 .8s cubic-bezier(.2,.7,.3,1) .62s both}
.fl-b1{animation:swing1 .9s cubic-bezier(.2,.7,.3,1) .95s both}
.fl-b3 path{animation:tint 1.5s ease .3s both}
.fl-b2 path{animation:tint 1.45s ease .62s both}
.fl-b1 path{animation:tint 1.4s ease .95s both}
@keyframes swing3{
  0%{transform:rotate(80deg);opacity:0}
  10%{opacity:1}
  60%{transform:rotate(-3deg);animation-timing-function:ease-in-out}
  80%{transform:rotate(1.4deg);animation-timing-function:ease-in-out}
  100%{transform:rotate(0deg);opacity:1}
}
@keyframes swing2{
  0%{transform:rotate(80deg);opacity:0}
  10%{opacity:1}
  60%{transform:rotate(-3deg);animation-timing-function:ease-in-out}
  80%{transform:rotate(1.4deg);animation-timing-function:ease-in-out}
  100%{transform:rotate(0deg);opacity:1}
}
@keyframes swing1{
  0%{transform:rotate(80deg);opacity:0}
  10%{opacity:1}
  55%{transform:rotate(-4deg);animation-timing-function:ease-in-out}
  75%{transform:rotate(1.6deg);animation-timing-function:ease-in-out}
  100%{transform:rotate(0deg);opacity:1}
}
@keyframes tint{
  0%{fill:#ecd9ee}
  55%{fill:#b44cb4}
  100%{fill:#800080}
}
@keyframes dock{
  to{transform:translateX(0) scale(1)}
}
@keyframes word-in{
  from{opacity:0;transform:translateX(calc(var(--m)*-.22))}
  to{opacity:1;transform:translateX(0)}
}

/* ---- ?loop: endless logo-only wrap / unwrap cycle ---- */
.loop .word{display:none}
.loop .markwrap{transform:none;animation:none}
.loop .fl-b3{animation:loop3 4.6s cubic-bezier(.3,.1,.25,1) infinite}
.loop .fl-b2{animation:loop2 4.6s cubic-bezier(.3,.1,.25,1) infinite}
.loop .fl-b1{animation:loop1 4.6s cubic-bezier(.3,.1,.25,1) infinite}
.loop .fl-b3 path{animation:loop-tint3 4.6s linear infinite}
.loop .fl-b2 path{animation:loop-tint2 4.6s linear infinite}
.loop .fl-b1 path{animation:loop-tint1 4.6s linear infinite}
@keyframes loop3{
  0%,2%{transform:rotate(80deg);opacity:0;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  5%{opacity:1}
  12%{transform:rotate(-3deg);animation-timing-function:ease-in-out}
  16%{transform:rotate(1.4deg);animation-timing-function:ease-in-out}
  20%{transform:rotate(0deg)}
  80%{transform:translateX(0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  90%{transform:translateX(175px) rotate(-8deg);opacity:0}
  100%{transform:rotate(80deg);opacity:0}
}
@keyframes loop2{
  0%,10%{transform:rotate(80deg);opacity:0;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  13%{opacity:1}
  20%{transform:rotate(-3deg);animation-timing-function:ease-in-out}
  24%{transform:rotate(1.4deg);animation-timing-function:ease-in-out}
  28%{transform:rotate(0deg)}
  76%{transform:translateX(0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  86%{transform:translateX(230px) rotate(-8deg);opacity:0}
  100%{transform:rotate(80deg);opacity:0}
}
@keyframes loop1{
  0%,18%{transform:rotate(80deg);opacity:0;animation-timing-function:cubic-bezier(.2,.7,.3,1)}
  21%{opacity:1}
  28%{transform:rotate(-4deg);animation-timing-function:ease-in-out}
  32%{transform:rotate(1.6deg);animation-timing-function:ease-in-out}
  36%{transform:rotate(0deg)}
  72%{transform:translateX(0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  82%{transform:translateX(280px) rotate(-8deg);opacity:0}
  100%{transform:rotate(80deg);opacity:0}
}
@keyframes loop-tint3{
  0%,2%{fill:#ecd9ee} 16%{fill:#b44cb4} 34%,80%{fill:#800080} 90%,100%{fill:#ecd9ee}
}
@keyframes loop-tint2{
  0%,10%{fill:#ecd9ee} 24%{fill:#b44cb4} 38%,76%{fill:#800080} 86%,100%{fill:#ecd9ee}
}
@keyframes loop-tint1{
  0%,18%{fill:#ecd9ee} 32%{fill:#b44cb4} 44%,72%{fill:#800080} 82%,100%{fill:#ecd9ee}
}
.hint{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);
  font:500 13px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:.01em;
  color:#6a6a6a;white-space:nowrap;pointer-events:none;
  animation:hint-fade 6s ease forwards}
.hint b{color:#9a9a9a;font-weight:700}
.hint.gone{animation:none;opacity:0}
@keyframes hint-fade{0%,55%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .mark *,.markwrap,.word{animation:none!important}
  .markwrap{transform:none}
  .word{opacity:1}
  .hint{animation:none;opacity:1}
}
</style>

<div class="hint" id="hint">click to replay &nbsp;·&nbsp; <b>L</b> loop &nbsp;·&nbsp; <b>F11</b> fullscreen</div>
<script>
(function(){
  if(/[?&]loop\b/.test(location.search)) document.body.classList.add('loop');
  /* --shift parks the mark at the exact screen centre during the build:
     half of (lockup width - mark width), measured after the font loads */
  function center(){
    var wrap=document.querySelector('.markwrap'), lock=document.querySelector('.lockup');
    document.body.style.setProperty('--shift',(lock.offsetWidth-wrap.offsetWidth)/2+'px');
  }
  center();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(center);
  addEventListener('resize',center);
  var hint=document.getElementById('hint');
  function hideHint(){ if(hint) hint.classList.add('gone'); }
  function replay(){
    var els=document.querySelectorAll('.mark .fl-bar,.mark path,.markwrap,.word');
    els.forEach(function(el){ el.style.animation='none'; });
    void document.body.offsetWidth; /* one reflow so the removal commits */
    els.forEach(function(el){ el.style.animation=''; });
  }
  addEventListener('click',function(){ hideHint(); replay(); });
  addEventListener('keydown',function(e){
    if(e.key==='r'||e.key==='R'){ hideHint(); replay(); }
    if(e.key==='l'||e.key==='L'){ hideHint(); document.body.classList.toggle('loop'); center(); replay(); }
  });
})();
</script>
